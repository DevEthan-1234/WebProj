<div class="banner">Banner</div>
<div class="row">
    <div class="content">
        <h1>Forms Page</h1>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

            <label for="number">Phone Number:</label>
            <input type="number" id="number" name="number" min="1" max="100"><br><br>

            <label for="url">Website:</label>
            <input type="url" id="url" name="url"><br><br>  

            <label for="date">Date:</label>
            <input type="date" id="date" name="date"><br><br>

            <label for="time">Time:</label>
            <input type="time" id="time" name="time"><br><br>

            <label for="color">Favorite Color:</label>
            <input type="color" id="color" name="color"><br><br>

            <label for="range">Range (1-10):</label>
            <input type="range" id="range" name="range" min="1" max="10"><br><br>

            <label for="file">Upload File:</label>
            <input type="file" id="file" name="file"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="checkbox">Subscribe to newsletter:</label>
            <input type="checkbox" id="checkbox" name="checkbox"><br><br>

            <input type="submit" value="Submit">
        </form>
    </div>
</div>

</body>
